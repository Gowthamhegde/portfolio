[package]
name = "portfolio"
version = "2.0.0"
edition = "2021"
authors = ["Gowthama Hegde <gowthamhegde606@gmail.com>"]
description = "Gowthama Hegde - Advanced Cloud Architect & Full-Stack Developer Portfolio built in Rust + WebAssembly"

[dependencies]
leptos = { version = "0.6.15", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlVideoElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "CanvasRenderingContext2d",
    "Performance",
    "DomRect",
    "Storage",
    "ScrollToOptions",
    "ScrollBehavior",
    "ScrollRestoration",
    "AudioContext",
    "OscillatorNode",
    "OscillatorType",
    "GainNode",
    "AudioParam",
    "AudioDestinationNode",
    "KeyboardEvent",
    "MouseEvent",
    "History",
    "Location",
    "Event",
    "Request",
    "RequestInit",
    "Response",
    "Headers"
] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-events = "0.2"
gloo-net = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
